name: Intent PR merged

# Merging an intent PR creates the ticket (Backlog). Fallback: /cl-core:intent publish.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  create-ticket:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'intent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create the ticket for each merged intent
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/intent-ticket.sh
