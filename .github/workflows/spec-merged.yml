name: Spec PR merged

# Merging a spec/<KEY>, spec/<KEY>-answers or spec/<KEY>-r<N> PR sets the ticket to Spec Review,
# but only when the ticket is In Progress and ticket_updates is "update". Otherwise it warns.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  spec-review:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'spec/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Move the ticket to Spec Review
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/spec-merged.sh
